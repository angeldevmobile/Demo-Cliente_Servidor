# Sistema completo: `docker compose up -d --build` → http://localhost:8086
# Postgres usa el puerto 5433. Los secretos vienen de .env (cp .env.example .env).

services:
  postgres:
    image: postgres:17-alpine
    container_name: comercio-db
    environment:
      POSTGRES_USER: comercio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en .env (cp .env.example .env)}
      POSTGRES_DB: comercio
    ports:
      - "5433:5432"
    volumes:
      - comercio-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercio"]
      interval: 3s
      timeout: 3s
      retries: 10

  app1:
    build: .
    environment: &entorno
      ORION_BD: postgres://comercio:${POSTGRES_PASSWORD}@postgres:5432/comercio
      ORION_JWT: ${ORION_JWT:?falta en .env (cp .env.example .env)}
      ORION_ADMIN_EMAIL: ${ORION_ADMIN_EMAIL:-admin@comercio.test}
      ORION_ADMIN_PASS: ${ORION_ADMIN_PASS:?falta en .env (cp .env.example .env)}
      ORION_INSTANCIA: app1
      # nginx pone aquí la IP del cliente; sin esto, todos tendrían la del balanceador.
      ORION_IP_CABECERA: x-real-ip
      # La pasarela es otro servicio; su aviso llega a la tienda por el balanceador.
      ORION_PASARELA_URL: http://pasarela:8090/pasarela
      ORION_URL_INTERNA: http://balanceador
      ORION_PASARELA_CLAVE: ${ORION_PASARELA_CLAVE:?falta en .env (cp .env.example .env)}
      ORION_PASARELA_SECRETO: ${ORION_PASARELA_SECRETO:?falta en .env (cp .env.example .env)}
      # Las facturas se envían al buzón de pruebas (http://localhost:8025).
      ORION_SMTP_HOST: correo
      ORION_SMTP_PUERTO: "1025"
      ORION_SMTP_SEGURIDAD: ninguna
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    environment:
      <<: *entorno
      ORION_INSTANCIA: app2
    depends_on:
      postgres:
        condition: service_healthy

  app3:
    build: .
    environment:
      <<: *entorno
      ORION_INSTANCIA: app3
    depends_on:
      postgres:
        condition: service_healthy

  # Workers en procesos separados: el trabajo en segundo plano no ocupa hilos de la web.
  worker1:
    build: .
    command: ["orion", "--run", "backend/worker.orx"]
    environment:
      <<: *entorno
      ORION_WORKER: worker1
    depends_on:
      postgres:
        condition: service_healthy

  worker2:
    build: .
    command: ["orion", "--run", "backend/worker.orx"]
    environment:
      <<: *entorno
      ORION_WORKER: worker2
    depends_on:
      postgres:
        condition: service_healthy

  # Buzón SMTP de pruebas: recibe los correos y los muestra en http://localhost:8025.
  correo:
    image: axllent/mailpit:latest
    container_name: comercio-correo
    ports:
      - "1025:1025"
      - "8025:8025"

  # Pasarela de pago simulada: otro proceso de Orion con sus propias tablas.
  pasarela:
    build: .
    command: ["orion", "--run", "pasarela/main.orx"]
    environment:
      ORION_BD: postgres://comercio:${POSTGRES_PASSWORD}@postgres:5432/comercio
      ORION_PASARELA_CLAVE: ${ORION_PASARELA_CLAVE:?falta en .env (cp .env.example .env)}
      ORION_PASARELA_SECRETO: ${ORION_PASARELA_SECRETO:?falta en .env (cp .env.example .env)}
      PORT: "8090"
    depends_on:
      postgres:
        condition: service_healthy

  balanceador:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - ./despliegue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - pasarela

volumes:
  comercio-datos:
