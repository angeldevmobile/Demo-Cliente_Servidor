# Postgres para la demo.
#
#   docker compose up -d
#
# Escucha en el 5433, no en el 5432: así no choca con un PostgreSQL que ya
# tengas instalado en la máquina.
#
# Estas credenciales son de juguete y están a la vista a propósito: la base
# vive en un contenedor local y no guarda nada real. Para apuntar a otro
# Postgres, cambia ORION_BD al arrancar la aplicación.

services:
  postgres:
    image: postgres:17-alpine
    container_name: comercio-db
    environment:
      POSTGRES_USER: comercio
      POSTGRES_PASSWORD: comercio
      POSTGRES_DB: comercio
    ports:
      - "5433:5432"
    volumes:
      - comercio-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercio"]
      interval: 3s
      timeout: 3s
      retries: 10

  app1:
    build: .
    environment: &entorno
      ORION_BD: postgres://comercio:comercio@postgres:5432/comercio
      ORION_JWT: secreto-compartido-entre-instancias
      ORION_INSTANCIA: app1
      # La pasarela es otro servicio; su aviso llega por el balanceador.
      ORION_PASARELA_URL: http://pasarela:8090/pasarela
      ORION_URL_INTERNA: http://balanceador
      ORION_PASARELA_CLAVE: clave-de-juguete
      ORION_PASARELA_SECRETO: secreto-de-juguete
      # Las facturas salen por correo al buzón falso (http://localhost:8025).
      ORION_SMTP_HOST: correo
      ORION_SMTP_PUERTO: "1025"
      ORION_SMTP_SEGURIDAD: ninguna
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build: .
    environment:
      <<: *entorno
      ORION_INSTANCIA: app2
    depends_on:
      postgres:
        condition: service_healthy

  app3:
    build: .
    environment:
      <<: *entorno
      ORION_INSTANCIA: app3
    depends_on:
      postgres:
        condition: service_healthy

  # Los workers no atienden peticiones: consumen la cola. Son procesos
  # aparte a proposito, para que una punta de trabajo en segundo plano no
  # robe hilos a quien esta comprando.
  worker1:
    build: .
    command: ["orion", "--run", "backend/worker.orx"]
    environment:
      <<: *entorno
      ORION_WORKER: worker1
    depends_on:
      postgres:
        condition: service_healthy

  worker2:
    build: .
    command: ["orion", "--run", "backend/worker.orx"]
    environment:
      <<: *entorno
      ORION_WORKER: worker2
    depends_on:
      postgres:
        condition: service_healthy

  # Buzón falso para probar el correo: recibe todo y lo enseña en
  # http://localhost:8025, sin mandar nada a nadie de verdad.
  correo:
    image: axllent/mailpit:latest
    container_name: comercio-correo
    ports:
      - "1025:1025"
      - "8025:8025"

  # Pasarela de pago simulada: otro proceso de Orion, con sus propias tablas.
  pasarela:
    build: .
    command: ["orion", "--run", "pasarela/main.orx"]
    environment:
      ORION_BD: postgres://comercio:comercio@postgres:5432/comercio
      ORION_PASARELA_CLAVE: clave-de-juguete
      ORION_PASARELA_SECRETO: secreto-de-juguete
      PORT: "8090"
    depends_on:
      postgres:
        condition: service_healthy

  balanceador:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - ./despliegue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - pasarela

volumes:
  comercio-datos:
