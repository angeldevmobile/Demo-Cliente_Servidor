# Balanceador round robin delante de tres instancias. Sin sesiones fijas (sticky):
# la sesión va en el JWT y los datos en Postgres, así cualquier instancia puede atender.

upstream comercio {
    server app1:8083;
    server app2:8083;
    server app3:8083;
}

server {
    listen 80;

    # Cabecera de diagnóstico con la instancia que atendió la petición.
    add_header X-Instancia $upstream_addr always;

    # Pasarela simulada (otro servicio). $http_host conserva el puerto (localhost:8086),
    # que la tienda usa para la URL de vuelta del pago; $host lo perdería.
    location /pasarela/ {
        proxy_pass http://pasarela:8090;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://comercio;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una instancia falla o se está reiniciando, reintenta en la siguiente.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
