# Balanceador delante de tres instancias de Comercio.
#
# Reparto por turnos (round robin), que es el reparto por defecto: cada
# peticion va a la siguiente instancia. No hay sesiones pegajosas a proposito,
# porque la aplicacion no guarda estado en el proceso: la sesion viaja en el
# JWT y los datos viven en Postgres. Si hiciera falta afinidad de sesion,
# seria la senal de que algo se esta guardando donde no debe.

upstream comercio {
    server app1:8083;
    server app2:8083;
    server app3:8083;
}

server {
    listen 80;

    # Cabecera de diagnostico: dice que instancia atendio la peticion. Es lo
    # que permite demostrar que el reparto ocurre de verdad.
    add_header X-Instancia $upstream_addr always;

    location / {
        proxy_pass http://comercio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si una instancia falla o esta reiniciandose, se reintenta en la
        # siguiente en vez de devolver el error al usuario.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
