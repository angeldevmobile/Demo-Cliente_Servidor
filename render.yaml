# Blueprint de Render (New > Blueprint). Plan gratuito: web y worker en el mismo contenedor;
# funciona porque la cola y los archivos están en Postgres.

databases:
  - name: comercio-db
    plan: free
    databaseName: comercio
    user: comercio

services:
  - type: web
    name: comercio
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Render no interpreta comillas en dockerCommand: el arranque va en un script.
    dockerCommand: sh despliegue/arranque.sh
    envVars:
      # Producción: los secretos son obligatorios, sin valores por defecto ni .env.
      - key: ORION_ENV
        value: production
      # URL interna de la base: no sale de la red de Render, va sin TLS.
      - key: ORION_BD
        fromDatabase:
          name: comercio-db
          property: connectionString
      - key: ORION_JWT
        generateValue: true
      # Render los pide al crear el Blueprint. Usa una contraseña nueva, no la del README.
      - key: ORION_ADMIN_EMAIL
        sync: false
      - key: ORION_ADMIN_PASS
        sync: false
      - key: ORION_INSTANCIA
        value: render-web
      # El proxy de Render pone la IP del cliente al principio de esta cabecera.
      - key: ORION_IP_CABECERA
        value: x-forwarded-for
      # La pasarela simulada va en el mismo proceso (sin ORION_PASARELA_URL).
      - key: ORION_PASARELA_CLAVE
        generateValue: true
      - key: ORION_PASARELA_SECRETO
        generateValue: true
      - key: ORION_WORKER
        value: render-worker
